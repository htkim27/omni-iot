[project]
name = "omni-iot"
version = "0.1.0"
description = "Local OMNI voice chatbot harness with MCP-ready architecture."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.116.1",
    "mcp>=2,<3",
    "numpy>=1.26.0",
    "omnivoice>=0.1.0",
    "openwakeword>=0.6,<0.7",
    "soundfile>=0.13.1",
    "torch>=2.8.0",
    "torchaudio>=2.8.0",
    "uvicorn[standard]>=0.35.0",
]

[project.scripts]
omni-iot = "omni_iot.server:main"
omni-iot-omni = "omni_iot.omni_llama:main"
omni-iot-mcp = "omni_iot.mcp_cli:main"
omni-iot-tts = "omni_iot.tts_omnivoice:main"
omni-iot-wakeword-models = "omni_iot.wakeword:download_model_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/omni_iot"]

[tool.uv]
exclude-dependencies = ["tflite-runtime"]

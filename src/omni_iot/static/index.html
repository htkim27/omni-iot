<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>omni-iot voice harness</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="panel">
        <header class="topbar">
          <div class="brand">
            <span id="stateDot" class="dot idle"></span>
            <span id="stateText">Idle</span>
          </div>
          <button id="resetButton" class="icon-button" type="button" title="Reset session">Reset</button>
        </header>

        <h1>omni-iot</h1>

        <div class="controls">
          <button id="startButton" class="primary" type="button">Start</button>
          <button id="stopButton" type="button" disabled>Stop</button>
        </div>

        <div class="meter" aria-hidden="true">
          <span id="meterBar"></span>
        </div>

        <div class="settings-block">
          <div class="settings-row">
            <label for="thresholdSlider">음성 감지 기준</label>
            <input
              id="thresholdSlider"
              type="range"
              min="1"
              max="12"
              value="4"
              aria-describedby="thresholdHelp"
            />
            <output id="thresholdValue" for="thresholdSlider" aria-label="현재 기준값">0.04</output>
          </div>
          <p id="thresholdHelp" class="settings-help">
            마이크 음량이 이 값 이상이면 발화로 인식합니다. 낮을수록 작은 소리에도 민감하며,
            주변 소음에 자주 반응하면 값을 높이세요.
          </p>
        </div>

        <audio id="replyAudio"></audio>

        <section class="conversation" aria-live="polite">
          <ol id="turnList"></ol>
        </section>
      </section>
    </main>

    <script src="/static/app.js"></script>
  </body>
</html>
